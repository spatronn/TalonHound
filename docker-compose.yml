services:
  db:
    image: postgres:16-alpine
    container_name: demo-db
    environment:
      - POSTGRES_DB=demo
      - POSTGRES_USER=demo
      - POSTGRES_PASSWORD=demo123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: demo-redis
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: demo-backend
    environment:
      - PORT=3000
      - DEMO_EMAIL=demo@demo.local
      - DEMO_PASSWORD=Password1!
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=demo123
      - DB_NAME=demo
      - REDIS_URL=redis://redis:6379
      - QUEUE_NAME=integration-imports
      - SIGNAL_QUEUE_NAME=signal-events
    depends_on:
      - db
      - redis
    restart: unless-stopped

  integration-scheduler:
    build: ./integration
    container_name: demo-integration-scheduler
    command: ["npm", "run", "scheduler"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=demo123
      - DB_NAME=demo
      - REDIS_URL=redis://redis:6379
      - QUEUE_NAME=integration-imports
      - SCHEDULER_CRON=0 * * * *
      - SOURCE_NAME=EmergingThreats:blockrules
      - SOURCE_INDEX_URL=http://rules.emergingthreats.net/blockrules/
      - USOM_SOURCE_NAME=USOM:TR-CERT
      - USOM_API_URL=https://www.usom.gov.tr/url-list.txt
      - URLHAUS_SOURCE_NAME=URLhaus:abuse.ch
      - URLHAUS_URL=https://urlhaus.abuse.ch/downloads/text/
      - THREATFOX_SOURCE_NAME=ThreatFox:abuse.ch
      - THREATFOX_CSV_URL=https://threatfox.abuse.ch/export/csv/full/
    depends_on:
      - db
      - redis
    restart: unless-stopped

  integration-worker:
    build: ./integration
    container_name: demo-integration-worker
    command: ["npm", "run", "worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=demo123
      - DB_NAME=demo
      - REDIS_URL=redis://redis:6379
      - QUEUE_NAME=integration-imports
      - WORKER_CONCURRENCY=1
      - SOURCE_NAME=EmergingThreats:blockrules
      - SOURCE_INDEX_URL=http://rules.emergingthreats.net/blockrules/
      - USOM_SOURCE_NAME=USOM:TR-CERT
      - USOM_API_URL=https://www.usom.gov.tr/url-list.txt
      - URLHAUS_SOURCE_NAME=URLhaus:abuse.ch
      - URLHAUS_URL=https://urlhaus.abuse.ch/downloads/text/
      - THREATFOX_SOURCE_NAME=ThreatFox:abuse.ch
      - THREATFOX_CSV_URL=https://threatfox.abuse.ch/export/csv/full/
    depends_on:
      - db
      - redis
    restart: unless-stopped

  signal-engine:
    build: ./backend
    container_name: demo-signal-engine
    command: ["npm", "run", "signal-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=demo123
      - DB_NAME=demo
      - REDIS_URL=redis://redis:6379
      - SIGNAL_QUEUE_NAME=signal-events
      - SIGNAL_WORKER_CONCURRENCY=2
    depends_on:
      - db
      - redis
    restart: unless-stopped

  signal-retention:
    build: ./backend
    container_name: demo-signal-retention
    command: ["npm", "run", "raw-retention"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=demo123
      - DB_NAME=demo
      - RAW_RETENTION_DAYS=30
      - RETENTION_CHECK_INTERVAL_SECONDS=3600
    depends_on:
      - db
    restart: unless-stopped

  dashboard-map-worker:
    build: ./backend
    container_name: demo-dashboard-map-worker
    command: ["npm", "run", "dashboard-map-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=demo123
      - DB_NAME=demo
      - DASHBOARD_MAP_CHUNK_SIZE=1000
      - DASHBOARD_MAP_INTERVAL_MS=5000
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: demo-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data:

services:
  db:
    image: postgres:16-alpine
    container_name: demo-db
    environment:
      - POSTGRES_DB=demo
      - POSTGRES_USER=demo
      - POSTGRES_PASSWORD=demo123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: demo-redis
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: demo-backend
    environment:
      - PORT=3000
      - DEMO_EMAIL=demo@demo.local
      - DEMO_PASSWORD=Password1!
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=demo123
      - DB_NAME=demo
      - REDIS_URL=redis://redis:6379
      - QUEUE_NAME=integration-imports
      - SIGNAL_QUEUE_NAME=signal-events
      # IOC list timing: log searchStringParse, dbQuery, responseSent, etc. (ms). Set to 0 or remove to disable.
      - IOC_LIST_TIMING=1
      - LOG_STORAGE=clickhouse
      - CLICKHOUSE_URL=http://demo-clickhouse:8123
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=demo123
    depends_on:
      - db
      - redis
      - clickhouse
    restart: unless-stopped

  integration-scheduler:
    build: ./integration
    container_name: demo-integration-scheduler
    command: ["npm", "run", "scheduler"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=demo123
      - DB_NAME=demo
      - REDIS_URL=redis://redis:6379
      - QUEUE_NAME=integration-imports
      - SCHEDULER_CRON=0 * * * *
      - SOURCE_NAME=EmergingThreats:blockrules
      - SOURCE_INDEX_URL=http://rules.emergingthreats.net/blockrules/
      - USOM_SOURCE_NAME=USOM:TR-CERT
      - USOM_API_URL=https://www.usom.gov.tr/url-list.txt
      - URLHAUS_SOURCE_NAME=URLhaus:abuse.ch
      - URLHAUS_URL=https://urlhaus.abuse.ch/downloads/text/
      - THREATFOX_SOURCE_NAME=ThreatFox:abuse.ch
      - THREATFOX_CSV_URL=https://threatfox.abuse.ch/export/csv/full/
    depends_on:
      - db
      - redis
    restart: unless-stopped

  integration-worker:
    build: ./integration
    container_name: demo-integration-worker
    command: ["npm", "run", "worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=demo123
      - DB_NAME=demo
      - REDIS_URL=redis://redis:6379
      - QUEUE_NAME=integration-imports
      - WORKER_CONCURRENCY=1
      - SOURCE_NAME=EmergingThreats:blockrules
      - SOURCE_INDEX_URL=http://rules.emergingthreats.net/blockrules/
      - USOM_SOURCE_NAME=USOM:TR-CERT
      - USOM_API_URL=https://www.usom.gov.tr/url-list.txt
      - URLHAUS_SOURCE_NAME=URLhaus:abuse.ch
      - URLHAUS_URL=https://urlhaus.abuse.ch/downloads/text/
      - THREATFOX_SOURCE_NAME=ThreatFox:abuse.ch
      - THREATFOX_CSV_URL=https://threatfox.abuse.ch/export/csv/full/
    depends_on:
      - db
      - redis
    restart: unless-stopped

  signal-engine:
    build: ./backend
    container_name: demo-signal-engine
    command: ["npm", "run", "signal-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=demo123
      - DB_NAME=demo
      - REDIS_URL=redis://redis:6379
      - SIGNAL_QUEUE_NAME=signal-events
      - SIGNAL_WORKER_CONCURRENCY=2
    depends_on:
      - db
      - redis
    restart: unless-stopped

  ioc-correlation-engine:
    build: ./backend
    container_name: demo-ioc-correlation-engine
    command: ["npm", "run", "ioc-correlation-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=demo123
      - DB_NAME=demo
      - LOG_STORAGE=clickhouse
      - CLICKHOUSE_URL=http://demo-clickhouse:8123
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=demo123
      - IOC_CORRELATION_WORKER_NAME=clickhouse-ioc-correlation-v1
      - IOC_CORRELATION_POLL_INTERVAL_MS=15000
      - IOC_CORRELATION_BATCH_SIZE=5000
      - IOC_CORRELATION_MAX_BATCHES_PER_TICK=2
      - IOC_CORRELATION_DEDUP_WINDOW_SECONDS=300
      - IOC_LOOKUP_SYNC_INTERVAL_SECONDS=3600
      - IOC_LOOKUP_SYNC_BATCH_SIZE=20000
      - IOC_LOOKUP_SYNC_ENABLED=1
      - IOC_CORRELATION_CH_MAX_THREADS=2
      - IOC_CORRELATION_CH_MAX_EXECUTION_TIME_SECONDS=20
    depends_on:
      - db
      - clickhouse
    restart: unless-stopped

  ioc-retro-engine:
    build: ./backend
    container_name: demo-ioc-retro-engine
    command: ["npm", "run", "ioc-retro-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=demo123
      - DB_NAME=demo
      - LOG_STORAGE=clickhouse
      - CLICKHOUSE_URL=http://demo-clickhouse:8123
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=demo123
      - IOC_LOOKUP_SYNC_INTERVAL_SECONDS=3600
      - IOC_LOOKUP_SYNC_ENABLED=0
      - IOC_RETRO_SCAN_INTERVAL_SECONDS=3600
      - IOC_RETRO_LOOKBACK_DAYS=30
      - IOC_RETRO_NEW_IOC_WINDOW_HOURS=2
      - IOC_RETRO_MAX_NEW_IOCS=5000
      - IOC_RETRO_BATCH_SIZE=5000
      - IOC_RETRO_POLL_INTERVAL_MS=10000
      - IOC_CORRELATION_DEDUP_WINDOW_SECONDS=300
      - IOC_RETRO_CH_MAX_THREADS=2
      - IOC_RETRO_CH_MAX_EXECUTION_TIME_SECONDS=25
    depends_on:
      - db
      - clickhouse
    restart: unless-stopped

  dashboard-map-worker:
    build: ./backend
    container_name: demo-dashboard-map-worker
    command: ["npm", "run", "dashboard-map-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=demo123
      - DB_NAME=demo
      - DASHBOARD_MAP_CHUNK_SIZE=1000
      - DASHBOARD_MAP_INTERVAL_MS=5000
    depends_on:
      - db
    restart: unless-stopped


  syslog-receiver:
    build: ./backend
    container_name: demo-syslog-receiver
    command: ["npm", "run", "syslog-receiver"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=demo123
      - DB_NAME=demo
      - SYSLOG_PORT=514
      - SYSLOG_HOST=0.0.0.0
      - SYSLOG_HEALTH_PORT=8081
      # Avoid ClickHouse small-part amplification: micro-batch flush (rows OR time)
      - SYSLOG_BATCH_SIZE=5000
      - SYSLOG_FLUSH_INTERVAL_MS=150
      - SYSLOG_FLUSH_WORKERS=1
      - SYSLOG_MAX_BUFFERED=100000
      - SYSLOG_OVERFLOW_POLICY=drop_oldest
      - SYSLOG_SOCKET_RCVBUF=8388608
      - LOG_STORAGE=clickhouse
      - CLICKHOUSE_URL=http://demo-clickhouse:8123
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=demo123
    depends_on:
      - db
      - clickhouse
    ports:
      - "514:514/udp"
      - "8081:8081"
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: demo-clickhouse
    environment:
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=demo123
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./db/clickhouse-init:/docker-entrypoint-initdb.d:ro
      - ./db/clickhouse-config/low-io-logs.xml:/etc/clickhouse-server/config.d/low-io-logs.xml:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: demo-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:

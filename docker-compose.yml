services:
  db:
    image: postgres:16-alpine
    container_name: demo-db
    environment:
      - POSTGRES_DB=demo
      - POSTGRES_USER=demo
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: demo-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev-insecure-redis}"]
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: demo-backend
    environment:
      - PORT=3000
      - DEMO_EMAIL=demo@demo.local
      - DEMO_PASSWORD=Password1!
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars, e.g. openssl rand -hex 32)}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-insecure-redis}
      - QUEUE_NAME=integration-imports
      - SIGNAL_QUEUE_NAME=signal-events
      - LLM_RISK_QUEUE_NAME=llm-risk-jobs
      - LLM_RISK_ADVISOR_ENABLED=${LLM_RISK_ADVISOR_ENABLED:-false}
      - LLM_RISK_ADVISOR_URL=${LLM_RISK_ADVISOR_URL:-http://192.168.1.26:11434/api/generate}
      - LLM_RISK_ADVISOR_MODEL=${LLM_RISK_ADVISOR_MODEL:-qwen2.5:7b}
      - LLM_RISK_ADVISOR_TIMEOUT_MS=${LLM_RISK_ADVISOR_TIMEOUT_MS:-8000}
      - LLM_RISK_ADVISOR_MANUAL_TIMEOUT_MS=${LLM_RISK_ADVISOR_MANUAL_TIMEOUT_MS:-25000}
      - LLM_RISK_ADVISOR_AI_WEIGHT=${LLM_RISK_ADVISOR_AI_WEIGHT:-2}
      - LLM_RISK_ADVISOR_CACHE_TTL_SECONDS=${LLM_RISK_ADVISOR_CACHE_TTL_SECONDS:-3600}
      # IOC list timing: log searchStringParse, dbQuery, responseSent, etc. (ms). Set to 0 or remove to disable.
      - IOC_LIST_TIMING=1
      - LOG_STORAGE=clickhouse
      - CLICKHOUSE_URL=http://demo-clickhouse:8123
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    depends_on:
      - db
      - redis
      - clickhouse
    restart: unless-stopped

  integration-scheduler:
    build: ./integration
    container_name: demo-integration-scheduler
    command: ["npm", "run", "scheduler"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-insecure-redis}
      - QUEUE_NAME=integration-imports
      - SCHEDULER_CRON=0 * * * *
      - SOURCE_NAME=EmergingThreats:blockrules
      - SOURCE_INDEX_URL=http://rules.emergingthreats.net/blockrules/
      - USOM_SOURCE_NAME=USOM:TR-CERT
      - USOM_API_URL=https://www.usom.gov.tr/url-list.txt
      - URLHAUS_SOURCE_NAME=URLhaus:abuse.ch
      - URLHAUS_URL=https://urlhaus.abuse.ch/downloads/text/
      - THREATFOX_SOURCE_NAME=ThreatFox:abuse.ch
      - THREATFOX_CSV_URL=https://threatfox.abuse.ch/export/csv/full/
    depends_on:
      - db
      - redis
    restart: unless-stopped

  integration-worker:
    build: ./integration
    container_name: demo-integration-worker
    command: ["npm", "run", "worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-insecure-redis}
      - QUEUE_NAME=integration-imports
      - WORKER_CONCURRENCY=1
      - SOURCE_NAME=EmergingThreats:blockrules
      - SOURCE_INDEX_URL=http://rules.emergingthreats.net/blockrules/
      - USOM_SOURCE_NAME=USOM:TR-CERT
      - USOM_API_URL=https://www.usom.gov.tr/url-list.txt
      - URLHAUS_SOURCE_NAME=URLhaus:abuse.ch
      - URLHAUS_URL=https://urlhaus.abuse.ch/downloads/text/
      - THREATFOX_SOURCE_NAME=ThreatFox:abuse.ch
      - THREATFOX_CSV_URL=https://threatfox.abuse.ch/export/csv/full/
    depends_on:
      - db
      - redis
    restart: unless-stopped

  signal-engine:
    build: ./backend
    container_name: demo-signal-engine
    command: ["npm", "run", "signal-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-insecure-redis}
      - SIGNAL_QUEUE_NAME=signal-events
      - SIGNAL_WORKER_CONCURRENCY=2
    depends_on:
      - db
      - redis
    restart: unless-stopped

  ioc-correlation-engine:
    build: ./backend
    container_name: demo-ioc-correlation-engine
    command: ["npm", "run", "ioc-correlation-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - LOG_STORAGE=clickhouse
      - CLICKHOUSE_URL=http://demo-clickhouse:8123
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - IOC_CORRELATION_WORKER_NAME=clickhouse-ioc-correlation-v1
      - IOC_CORRELATION_POLL_INTERVAL_MS=30000
      - IOC_CORRELATION_BATCH_SIZE=2000
      - IOC_CORRELATION_MAX_BATCHES_PER_TICK=1
      - IOC_CORRELATION_DEDUP_WINDOW_SECONDS=300
      - IOC_LOOKUP_SYNC_INTERVAL_SECONDS=300
      - IOC_LOOKUP_SYNC_BATCH_SIZE=20000
      - IOC_LOOKUP_SYNC_ENABLED=1
      - IOC_CORRELATION_CH_MAX_THREADS=1
      - IOC_CORRELATION_CH_MAX_EXECUTION_TIME_SECONDS=20
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-insecure-redis}
      - LLM_RISK_QUEUE_NAME=llm-risk-jobs
      - LLM_RISK_TRIGGER_ENABLED=1
      - LLM_RISK_SNAPSHOT_TTL_SECONDS=604800
    depends_on:
      - db
      - clickhouse
    restart: unless-stopped

  ioc-retro-engine:
    build: ./backend
    container_name: demo-ioc-retro-engine
    command: ["npm", "run", "ioc-retro-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - LOG_STORAGE=clickhouse
      - CLICKHOUSE_URL=http://demo-clickhouse:8123
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - IOC_LOOKUP_SYNC_INTERVAL_SECONDS=3600
      - IOC_LOOKUP_SYNC_ENABLED=0
      - IOC_RETRO_SCAN_INTERVAL_SECONDS=3600
      - IOC_RETRO_LOOKBACK_DAYS=30
      - IOC_RETRO_NEW_IOC_WINDOW_HOURS=24
      - IOC_RETRO_MAX_NEW_IOCS=20000
      - IOC_RETRO_BATCH_SIZE=5000
      - IOC_RETRO_IOC_CHUNK_SIZE=1000
      - IOC_RETRO_POLL_INTERVAL_MS=5000
      - IOC_RETRO_ALIGN_ENABLED=1
      - IOC_RETRO_ALIGN_MINUTE=10
      - IOC_CORRELATION_DEDUP_WINDOW_SECONDS=300
      - IOC_RETRO_CH_MAX_THREADS=1
      - IOC_RETRO_CH_MAX_EXECUTION_TIME_SECONDS=25
    depends_on:
      - db
      - clickhouse
    restart: unless-stopped

  ioc-match-count-worker:
    build: ./backend
    container_name: demo-ioc-match-count-worker
    command: ["npm", "run", "ioc-match-count-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - LOG_STORAGE=clickhouse
      - CLICKHOUSE_URL=http://demo-clickhouse:8123
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - IOC_MATCH_COUNT_INTERVAL_MS=60000
      - IOC_MATCH_COUNT_BATCH_SIZE=2000
      - IOC_MATCH_COUNT_CH_MAX_THREADS=1
      - IOC_MATCH_COUNT_CH_MAX_EXECUTION_TIME_SECONDS=120
    depends_on:
      - db
      - clickhouse
    restart: unless-stopped

  dashboard-map-worker:
    build: ./backend
    container_name: demo-dashboard-map-worker
    command: ["npm", "run", "dashboard-map-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - DASHBOARD_MAP_CHUNK_SIZE=1000
      - DASHBOARD_MAP_INTERVAL_MS=5000
    depends_on:
      - db
    restart: unless-stopped

  llm-risk-worker:
    build: ./backend
    container_name: demo-llm-risk-worker
    command: ["npm", "run", "llm-risk-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-insecure-redis}
      - LLM_RISK_QUEUE_NAME=llm-risk-jobs
      - LLM_RISK_WORKER_CONCURRENCY=1
      - LLM_RISK_ADVISOR_ENABLED=${LLM_RISK_ADVISOR_ENABLED:-false}
      - LLM_RISK_ADVISOR_URL=${LLM_RISK_ADVISOR_URL:-http://192.168.1.26:11434/api/generate}
      - LLM_RISK_ADVISOR_MODEL=${LLM_RISK_ADVISOR_MODEL:-qwen2.5:7b}
      - LLM_RISK_ADVISOR_TIMEOUT_MS=${LLM_RISK_ADVISOR_TIMEOUT_MS:-8000}
      - LLM_RISK_ADVISOR_MANUAL_TIMEOUT_MS=${LLM_RISK_ADVISOR_MANUAL_TIMEOUT_MS:-25000}
      - LLM_RISK_ADVISOR_AI_WEIGHT=${LLM_RISK_ADVISOR_AI_WEIGHT:-2}
      - LLM_RISK_ADVISOR_CACHE_TTL_SECONDS=${LLM_RISK_ADVISOR_CACHE_TTL_SECONDS:-3600}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  enrichment-sync-job:
    build: ./backend
    container_name: demo-enrichment-sync-job
    command: ["npm", "run", "enrichment-sync-job"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - ENRICHMENT_SYNC_INTERVAL_MS=86400000
      - ENRICHMENT_SYNC_BATCH_SIZE=5000
      - ENRICHMENT_SYNC_ONCE=0
      - ENRICHMENT_SOURCE_URL=https://geoip.oxl.app/file/asn_full.json.zip
    depends_on:
      - db
    restart: unless-stopped

  syslog-receiver:
    build: ./backend
    container_name: demo-syslog-receiver
    command: ["npm", "run", "syslog-receiver"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - SYSLOG_PORT=514
      - SYSLOG_HOST=0.0.0.0
      - SYSLOG_HEALTH_PORT=8081
      - SYSLOG_HEALTH_TOKEN=${SYSLOG_HEALTH_TOKEN:?Set SYSLOG_HEALTH_TOKEN in .env (e.g. openssl rand -hex 16)}
      # Avoid ClickHouse small-part amplification: micro-batch flush (rows OR time)
      - SYSLOG_BATCH_SIZE=3000
      - SYSLOG_MIN_FLUSH_SIZE=1000
      - SYSLOG_MIN_INSERT_ROWS=1000
      - SYSLOG_FORCE_FLUSH_MAX_MS=60000
      - SYSLOG_FLUSH_INTERVAL_MS=3000
      - SYSLOG_FLUSH_WORKERS=1
      - SYSLOG_MAX_BUFFERED=100000
      - SYSLOG_OVERFLOW_POLICY=drop_oldest
      - SYSLOG_SOCKET_RCVBUF=8388608
      - LOG_STORAGE=clickhouse
      - CLICKHOUSE_URL=http://demo-clickhouse:8123
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    depends_on:
      - db
      - clickhouse
    # UDP 514 / HTTP health are not published on the host by default (avoids open ingest + unauthenticated metrics).
    # To expose for local forwarders or host scripts: docker compose -f docker-compose.yml -f docker-compose.syslog-host.yml up -d
    restart: unless-stopped

  # ClickHouse is reachable only on the Docker network (demo-clickhouse:8123 / :9000).
  # Do not publish HTTP/native ports to the host in production. For ad-hoc queries:
  #   docker compose exec clickhouse clickhouse-client -u demo --password "$CLICKHOUSE_PASSWORD"
  clickhouse:
    build:
      context: .
      dockerfile: Dockerfile.clickhouse
    container_name: demo-clickhouse
    environment:
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    restart: unless-stopped

  loadgen:
    build: ./tools/loadgen
    container_name: demo-loadgen
    profiles: ["manual"]
    environment:
      - PYTHONUNBUFFERED=1
      - ENABLED=0
      - MODE=mixed
      - EPS=100
      - DURATION_SECONDS=86400
      - IOC_INSERT_RATIO=0
      - REALTIME_RATIO=0.5
      - RETRO_DELAY_MS=0
      - STATS_EVERY_SEC=10
      - SYSLOG_HOST=syslog-receiver
      - SYSLOG_PORT=514
      - IOC_API_BASE=http://backend:3000
      - API_INGEST_TOKEN=${API_INGEST_TOKEN:-}
      - API_BEARER_TOKEN=${API_BEARER_TOKEN:-}
      - IOC_SOURCE_NAME=loadgen-smoke
      - IOC_CONFIDENCE=90
      - IOC_NOTE=loadgen random ioc
    depends_on:
      - backend
      - syslog-receiver
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: demo-frontend
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    build: ./proxy
    container_name: demo-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/certs:/etc/nginx/certs
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:

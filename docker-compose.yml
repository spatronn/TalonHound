services:
  db:
    image: postgres:16-alpine
    container_name: demo-db
    command:
      - postgres
      - -c
      - shared_buffers=1024MB
      - -c
      - work_mem=16MB
      - -c
      - effective_cache_size=3GB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    environment:
      - POSTGRES_DB=demo
      - POSTGRES_USER=demo
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: demo-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev-insecure-redis}"]
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: demo-backend
    environment:
      - PORT=3000
      # Dev-only bootstrap login. Set in .env for local demos; leave unset in production.
      - DEMO_EMAIL=${DEMO_EMAIL:-}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars, e.g. openssl rand -hex 32)}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-insecure-redis}
      - QUEUE_NAME=integration-imports
      - INTEGRATION_JOB_TIMEOUT_MS=600000
      - INTEGRATION_JOB_STALE_AFTER_MS=900000
      # IOC list timing: log searchStringParse, dbQuery, responseSent, etc. (ms). Set to 0 or remove to disable.
      - IOC_LIST_TIMING=1
      - API_INGEST_TOKEN=${API_INGEST_TOKEN:-}
    depends_on:
      - db
      - redis
    volumes:
      - ./backups:/backups
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  integration-scheduler:
    build:
      context: .
      dockerfile: integration/Dockerfile
    container_name: demo-integration-scheduler
    command: ["npm", "run", "scheduler"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-insecure-redis}
      - QUEUE_NAME=integration-imports
      - SCHEDULER_CRON=0 * * * *
      - SOURCE_NAME=EmergingThreats:blockrules
      - SOURCE_INDEX_URL=http://rules.emergingthreats.net/blockrules/
      - USOM_SOURCE_NAME=USOM:TR-CERT
      - USOM_API_URL=https://www.usom.gov.tr/url-list.txt
      - URLHAUS_SOURCE_NAME=URLhaus:abuse.ch
      - URLHAUS_AUTH_KEY=${URLHAUS_AUTH_KEY:-}
      - MALWARE_BAZAAR_SOURCE_NAME=MalwareBazaar:abuse.ch
      - MALWAREBAZAAR_AUTH_KEY=${MALWAREBAZAAR_AUTH_KEY:-}
      - THREATFOX_SOURCE_NAME=ThreatFox:abuse.ch
      - THREATFOX_AUTH_KEY=${THREATFOX_AUTH_KEY:-}
      - THREATFOX_API_URL=${THREATFOX_API_URL:-https://threatfox-api.abuse.ch/api/v1/}
      - THREATFOX_RECENT_DAYS=${THREATFOX_RECENT_DAYS:-3}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  integration-worker:
    build:
      context: .
      dockerfile: integration/Dockerfile
    container_name: demo-integration-worker
    command: ["npm", "run", "worker"]
    stop_grace_period: 45s
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-insecure-redis}
      - QUEUE_NAME=integration-imports
      - WORKER_CONCURRENCY=1
      - WORKER_LOCK_DURATION_MS=900000
      - WORKER_STALLED_INTERVAL_MS=60000
      - WORKER_MAX_STALLED_COUNT=5
      - INTEGRATION_JOB_TIMEOUT_MS=600000
      - EMERGINGTHREATS_JOB_TIMEOUT_MS=2700000
      - PHISHTANK_JOB_TIMEOUT_MS=3600000
      - PHISHTANK_BATCH_SIZE=2000
      - PHISHTANK_SOURCE_NAME=PhishTank:open_dnsrr
      - PHISHTANK_CSV_URL=${PHISHTANK_CSV_URL:-https://data.phishtank.com/data/online-valid.csv}
      - INTEGRATION_JOB_HEARTBEAT_INTERVAL_MS=30000
      - INTEGRATION_JOB_STALE_AFTER_MS=900000
      - INTEGRATION_WORKER_SHUTDOWN_GRACE_MS=30000
      - INTEGRATION_QUEUE_CLEANUP_INTERVAL_MS=60000
      - SOURCE_NAME=EmergingThreats:blockrules
      - SOURCE_INDEX_URL=http://rules.emergingthreats.net/blockrules/
      - USOM_SOURCE_NAME=USOM:TR-CERT
      - USOM_API_URL=https://www.usom.gov.tr/url-list.txt
      - URLHAUS_SOURCE_NAME=URLhaus:abuse.ch
      - URLHAUS_AUTH_KEY=${URLHAUS_AUTH_KEY:-}
      - MALWARE_BAZAAR_SOURCE_NAME=MalwareBazaar:abuse.ch
      - MALWAREBAZAAR_AUTH_KEY=${MALWAREBAZAAR_AUTH_KEY:-}
      - THREATFOX_SOURCE_NAME=ThreatFox:abuse.ch
      - THREATFOX_AUTH_KEY=${THREATFOX_AUTH_KEY:-}
      - THREATFOX_API_URL=${THREATFOX_API_URL:-https://threatfox-api.abuse.ch/api/v1/}
      - THREATFOX_RECENT_DAYS=${THREATFOX_RECENT_DAYS:-3}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  ioc-expiration-worker:
    build: ./backend
    container_name: demo-ioc-expiration-worker
    command: ["npm", "run", "ioc-expiration-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - IOC_EXPIRATION_POLL_INTERVAL_MS=60000
      - IOC_EXPIRATION_BATCH_SIZE=500
    depends_on:
      - db
    restart: unless-stopped

  syslog-receiver:
    build: ./backend
    container_name: demo-syslog-receiver
    command: ["npm", "run", "syslog-receiver"]
    ports:
      - "514:514/udp"
      - "8081:8081"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - SYSLOG_PORT=514
      - SYSLOG_HOST=0.0.0.0
      - SYSLOG_HEALTH_PORT=8081
      - SYSLOG_HEALTH_TOKEN=${SYSLOG_HEALTH_TOKEN:?Set SYSLOG_HEALTH_TOKEN in .env (e.g. openssl rand -hex 16)}
      - SYSLOG_BATCH_SIZE=500
      - SYSLOG_MIN_FLUSH_SIZE=100
      - SYSLOG_MIN_INSERT_ROWS=100
      - SYSLOG_FORCE_FLUSH_MAX_MS=10000
      - SYSLOG_FLUSH_INTERVAL_MS=2000
      - SYSLOG_FLUSH_WORKERS=1
      - SYSLOG_MAX_BUFFERED=100000
      - SYSLOG_OVERFLOW_POLICY=drop_oldest
      - SYSLOG_SOCKET_RCVBUF=8388608
    depends_on:
      - db
    # UDP 514 / HTTP health are not published on the host by default (avoids open ingest + unauthenticated metrics).
    # To expose for local forwarders or host scripts: docker compose -f docker-compose.yml -f docker-compose.syslog-host.yml up -d
    restart: unless-stopped

  loadgen:
    build: ./tools/loadgen
    container_name: demo-loadgen
    profiles: ["manual"]
    environment:
      - PYTHONUNBUFFERED=1
      - ENABLED=0
      - MODE=mixed
      - EPS=100
      - DURATION_SECONDS=86400
      - IOC_INSERT_RATIO=0
      - REALTIME_RATIO=0.5
      - RETRO_DELAY_MS=0
      - STATS_EVERY_SEC=10
      - SYSLOG_HOST=syslog-receiver
      - SYSLOG_PORT=514
      - IOC_API_BASE=http://backend:3000
      - API_INGEST_TOKEN=${API_INGEST_TOKEN:-}
      - API_BEARER_TOKEN=${API_BEARER_TOKEN:-}
      - IOC_SOURCE_NAME=loadgen-smoke
      - IOC_CONFIDENCE=90
      - IOC_NOTE=loadgen random ioc
    depends_on:
      - backend
      - syslog-receiver
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: demo-frontend
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    build: ./proxy
    container_name: demo-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/certs:/etc/nginx/certs
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:

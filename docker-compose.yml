# Explicit project name so container/volume/network prefixes are stable regardless of
# the checkout directory. Override per-install with `-p <name>` or COMPOSE_PROJECT_NAME
# to run multiple TalonHound stacks on one host. Keep this value = the existing project
# name so named volumes (talonhound_postgres_data, ...) are preserved across upgrades.
name: talonhound

services:
  db:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_buffers=1024MB
      - -c
      - work_mem=16MB
      - -c
      - effective_cache_size=3GB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    environment:
      - POSTGRES_DB=talonhound
      - POSTGRES_USER=talonhound
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars, e.g. openssl rand -hex 32)}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=talonhound
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=talonhound
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - QUEUE_NAME=integration-imports
      - INTEGRATION_JOB_TIMEOUT_MS=600000
      - INTEGRATION_JOB_STALE_AFTER_MS=900000
      - USOM_INCREMENTAL_ENABLED=${USOM_INCREMENTAL_ENABLED:-true}
      - USOM_FULL_RECONCILIATION_ENABLED=${USOM_FULL_RECONCILIATION_ENABLED:-true}
      - USOM_FULL_RECONCILIATION_CRON=${USOM_FULL_RECONCILIATION_CRON:-0 3 * * 0}
      - USOM_FULL_RECONCILIATION_TIMEZONE=${USOM_FULL_RECONCILIATION_TIMEZONE:-Europe/Istanbul}
      - USOM_FULL_RECONCILIATION_MAX_AGE_DAYS=${USOM_FULL_RECONCILIATION_MAX_AGE_DAYS:-8}
      - SYSTEM_TIMEZONE=${SYSTEM_TIMEZONE:-}
      - TZ=${SYSTEM_TIMEZONE:-}
      # IOC list timing: log searchStringParse, dbQuery, responseSent, etc. (ms). Set to 0 or remove to disable.
      - IOC_LIST_TIMING=1
      - API_INGEST_TOKEN=${API_INGEST_TOKEN:-}
      - DNSMANIA_BASE_URL=${DNSMANIA_BASE_URL:-}
      - DNSMANIA_TIMEOUT_MS=${DNSMANIA_TIMEOUT_MS:-10000}
      - DNSMANIA_ENABLED=${DNSMANIA_ENABLED:-true}
      - FILE_ARTIFACTS_DUAL_WRITE_ENABLED=${FILE_ARTIFACTS_DUAL_WRITE_ENABLED:-0}
      - FILE_ARTIFACTS_READ_ENABLED=${FILE_ARTIFACTS_READ_ENABLED:-0}
      - IOC_EXPORT_QUEUE_NAME=ioc-search-export
      - IOC_EXPORT_STORAGE_DIR=/data/ioc-search-exports
      - BACKUP_ENABLED=${BACKUP_ENABLED:-true}
      - BACKUP_CRON=${BACKUP_CRON:-0 0 * * 0}
      - BACKUP_CRON_TIMEZONE=${BACKUP_CRON_TIMEZONE:-}
      - INTEGRATION_SCHEDULE_TIMEZONE=${INTEGRATION_SCHEDULE_TIMEZONE:-}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_DIR=/data/backups
      - BACKUP_ENCRYPTION_ENABLED=${BACKUP_ENCRYPTION_ENABLED:-false}
      - BACKUP_ENCRYPTION_KEY_FILE=${BACKUP_ENCRYPTION_KEY_FILE:-}
      - BACKUP_MAX_CONCURRENT=1
      - BACKUP_QUEUE_NAME=system-backup
      # Published Feed API keys: server-side AES-256-GCM key for revealable keys +
      # per-key pull rate limit for /api/published-feeds/{slug}.
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY:-}
      - FEED_PUBLIC_RATE_LIMIT_PER_MIN=${FEED_PUBLIC_RATE_LIMIT_PER_MIN:-60}
      # Phase-1 million-scale Published Feeds: file-backed streaming artifacts.
      # Default OFF; enable to activate bounded-memory generation + streamed serving.
      - PUBLISHED_FEED_STREAMING_ENABLED=${PUBLISHED_FEED_STREAMING_ENABLED:-false}
      - PUBLISHED_FEED_STORAGE_DIR=/data/published-feeds
    depends_on:
      - db
      - redis
    volumes:
      - backup_data:/data/backups
      - ioc_export_data:/data/ioc-search-exports
      - published_feed_data:/data/published-feeds
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  integration-scheduler:
    build:
      context: .
      dockerfile: integration/Dockerfile
    command: ["npm", "run", "scheduler"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=talonhound
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=talonhound
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - QUEUE_NAME=integration-imports
      - SYSTEM_TIMEZONE=${SYSTEM_TIMEZONE:-}
      - TZ=${SYSTEM_TIMEZONE:-}
      - FILE_ARTIFACTS_DUAL_WRITE_ENABLED=${FILE_ARTIFACTS_DUAL_WRITE_ENABLED:-0}
      - FILE_ARTIFACTS_READ_ENABLED=${FILE_ARTIFACTS_READ_ENABLED:-0}
      - SCHEDULER_CRON=0 * * * *
      - SOURCE_NAME=EmergingThreats:blockrules
      - SOURCE_INDEX_URL=http://rules.emergingthreats.net/blockrules/
      - USOM_API_BASE_URL=${USOM_API_BASE_URL:-https://siberguvenlik.gov.tr/api}
      - USOM_API_PER_PAGE=${USOM_API_PER_PAGE:-5000}
      - USOM_API_TIMEOUT_MS=${USOM_API_TIMEOUT_MS:-30000}
      - USOM_API_MAX_RETRIES=${USOM_API_MAX_RETRIES:-5}
      - USOM_API_REQUEST_DELAY_MS=${USOM_API_REQUEST_DELAY_MS:-250}
      - USOM_INCREMENTAL_ENABLED=${USOM_INCREMENTAL_ENABLED:-true}
      - USOM_FULL_RECONCILIATION_ENABLED=${USOM_FULL_RECONCILIATION_ENABLED:-true}
      - USOM_FULL_RECONCILIATION_CRON=${USOM_FULL_RECONCILIATION_CRON:-0 3 * * 0}
      - USOM_FULL_RECONCILIATION_TIMEZONE=${USOM_FULL_RECONCILIATION_TIMEZONE:-Europe/Istanbul}
      - URLHAUS_SOURCE_NAME=URLhaus:abuse.ch
      - URLHAUS_AUTH_KEY=${URLHAUS_AUTH_KEY:-}
      - MALWARE_BAZAAR_SOURCE_NAME=MalwareBazaar:abuse.ch
      - MALWAREBAZAAR_AUTH_KEY=${MALWAREBAZAAR_AUTH_KEY:-}
      - THREATFOX_SOURCE_NAME=ThreatFox:abuse.ch
      - THREATFOX_AUTH_KEY=${THREATFOX_AUTH_KEY:-}
      - THREATFOX_API_URL=${THREATFOX_API_URL:-https://threatfox-api.abuse.ch/api/v1/}
      - THREATFOX_RECENT_DAYS=${THREATFOX_RECENT_DAYS:-3}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  integration-worker:
    build:
      context: .
      dockerfile: integration/Dockerfile
    command: ["npm", "run", "worker"]
    stop_grace_period: 45s
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=talonhound
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=talonhound
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - QUEUE_NAME=integration-imports
      - SYSTEM_TIMEZONE=${SYSTEM_TIMEZONE:-}
      - TZ=${SYSTEM_TIMEZONE:-}
      - FILE_ARTIFACTS_DUAL_WRITE_ENABLED=${FILE_ARTIFACTS_DUAL_WRITE_ENABLED:-0}
      - FILE_ARTIFACTS_READ_ENABLED=${FILE_ARTIFACTS_READ_ENABLED:-0}
      - WORKER_CONCURRENCY=1
      - WORKER_LOCK_DURATION_MS=900000
      - WORKER_STALLED_INTERVAL_MS=60000
      - WORKER_MAX_STALLED_COUNT=5
      - INTEGRATION_JOB_TIMEOUT_MS=600000
      - USOM_JOB_TIMEOUT_MS=${USOM_JOB_TIMEOUT_MS:-7200000}
      - EMERGINGTHREATS_JOB_TIMEOUT_MS=2700000
      - PHISHTANK_JOB_TIMEOUT_MS=3600000
      - PHISHTANK_BATCH_SIZE=2000
      - PHISHTANK_SOURCE_NAME=PhishTank:open_dnsrr
      - PHISHTANK_CSV_URL=${PHISHTANK_CSV_URL:-https://data.phishtank.com/data/online-valid.csv}
      - INTEGRATION_JOB_HEARTBEAT_INTERVAL_MS=30000
      - INTEGRATION_JOB_STALE_AFTER_MS=900000
      - INTEGRATION_WORKER_SHUTDOWN_GRACE_MS=30000
      - INTEGRATION_QUEUE_CLEANUP_INTERVAL_MS=60000
      - SOURCE_NAME=EmergingThreats:blockrules
      - SOURCE_INDEX_URL=http://rules.emergingthreats.net/blockrules/
      - USOM_API_BASE_URL=${USOM_API_BASE_URL:-https://siberguvenlik.gov.tr/api}
      - USOM_API_PER_PAGE=${USOM_API_PER_PAGE:-5000}
      - USOM_API_TIMEOUT_MS=${USOM_API_TIMEOUT_MS:-30000}
      - USOM_API_MAX_RETRIES=${USOM_API_MAX_RETRIES:-5}
      - USOM_API_REQUEST_DELAY_MS=${USOM_API_REQUEST_DELAY_MS:-250}
      - USOM_IMPORT_MODE=${USOM_IMPORT_MODE:-incremental}
      - USOM_INCREMENTAL_ENABLED=${USOM_INCREMENTAL_ENABLED:-true}
      - USOM_INCREMENTAL_OVERLAP_HOURS=${USOM_INCREMENTAL_OVERLAP_HOURS:-24}
      - USOM_INCREMENTAL_MAX_RECORDS=${USOM_INCREMENTAL_MAX_RECORDS:-100000}
      - USOM_LOOKUP_CACHE_TTL_HOURS=${USOM_LOOKUP_CACHE_TTL_HOURS:-24}
      - USOM_DB_STATEMENT_TIMEOUT_MS=${USOM_DB_STATEMENT_TIMEOUT_MS:-1800000}
      - USOM_DB_IDLE_IN_TX_TIMEOUT_MS=${USOM_DB_IDLE_IN_TX_TIMEOUT_MS:-600000}
      - URLHAUS_SOURCE_NAME=URLhaus:abuse.ch
      - URLHAUS_AUTH_KEY=${URLHAUS_AUTH_KEY:-}
      - MALWARE_BAZAAR_SOURCE_NAME=MalwareBazaar:abuse.ch
      - MALWAREBAZAAR_AUTH_KEY=${MALWAREBAZAAR_AUTH_KEY:-}
      - THREATFOX_SOURCE_NAME=ThreatFox:abuse.ch
      - THREATFOX_AUTH_KEY=${THREATFOX_AUTH_KEY:-}
      - THREATFOX_API_URL=${THREATFOX_API_URL:-https://threatfox-api.abuse.ch/api/v1/}
      - THREATFOX_RECENT_DAYS=${THREATFOX_RECENT_DAYS:-3}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  ioc-expiration-worker:
    build: ./backend
    command: ["npm", "run", "ioc-expiration-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=talonhound
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=talonhound
      - SYSTEM_TIMEZONE=${SYSTEM_TIMEZONE:-}
      - TZ=${SYSTEM_TIMEZONE:-}
      - IOC_EXPIRATION_POLL_INTERVAL_MS=60000
      - IOC_EXPIRATION_BATCH_SIZE=500
    depends_on:
      - db
    restart: unless-stopped

  ioc-search-export-worker:
    build: ./backend
    command: ["npm", "run", "ioc-search-export-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=talonhound
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=talonhound
      - SYSTEM_TIMEZONE=${SYSTEM_TIMEZONE:-}
      - TZ=${SYSTEM_TIMEZONE:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - IOC_EXPORT_QUEUE_NAME=ioc-search-export
      - IOC_EXPORT_STORAGE_DIR=/data/ioc-search-exports
      - IOC_EXPORT_BATCH_SIZE=${IOC_EXPORT_BATCH_SIZE:-5000}
      - IOC_EXPORT_RETENTION_HOURS=${IOC_EXPORT_RETENTION_HOURS:-24}
      - IOC_EXPORT_HARD_LIMIT=${IOC_EXPORT_HARD_LIMIT:-2000000}
      - IOC_EXPORT_WORKER_CONCURRENCY=${IOC_EXPORT_WORKER_CONCURRENCY:-2}
      # Read-path flag must match the backend: the export worker re-parses the stored DSL
      # and runs the same file-artifact canonical/dedup resolution as POST /api/iocs/search.
      # Without it, hash/type filters (md5/sha1/sha256, type, known_hash_type) would resolve
      # differently in exports than in the search preview.
      - FILE_ARTIFACTS_READ_ENABLED=${FILE_ARTIFACTS_READ_ENABLED:-0}
    volumes:
      - ioc_export_data:/data/ioc-search-exports
    depends_on:
      - db
      - redis
    restart: unless-stopped

  ioc-deep-search-worker:
    build: ./backend
    command: ["npm", "run", "ioc-deep-search-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=talonhound
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=talonhound
      - SYSTEM_TIMEZONE=${SYSTEM_TIMEZONE:-}
      - TZ=${SYSTEM_TIMEZONE:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - IOC_DEEP_SEARCH_QUEUE_NAME=ioc-deep-search
      - IOC_DEEP_SEARCH_QUERY_TIMEOUT_MS=${IOC_DEEP_SEARCH_QUERY_TIMEOUT_MS:-600000}
      - IOC_DEEP_SEARCH_RETENTION_HOURS=${IOC_DEEP_SEARCH_RETENTION_HOURS:-24}
      - IOC_DEEP_SEARCH_WORKER_CONCURRENCY=${IOC_DEEP_SEARCH_WORKER_CONCURRENCY:-2}
      # Read-path flag must match the backend: the deep-search worker re-parses the stored
      # DSL and runs the same file-artifact canonical/dedup resolution as POST /api/iocs/search
      # so materialized results match the interactive preview exactly.
      - FILE_ARTIFACTS_READ_ENABLED=${FILE_ARTIFACTS_READ_ENABLED:-0}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  backup-worker:
    build: ./backend
    command: ["npm", "run", "backup-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=talonhound
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=talonhound
      - SYSTEM_TIMEZONE=${SYSTEM_TIMEZONE:-}
      - TZ=${SYSTEM_TIMEZONE:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - BACKUP_ENABLED=${BACKUP_ENABLED:-true}
      - BACKUP_CRON=${BACKUP_CRON:-0 0 * * 0}
      - BACKUP_CRON_TIMEZONE=${BACKUP_CRON_TIMEZONE:-}
      - INTEGRATION_SCHEDULE_TIMEZONE=${INTEGRATION_SCHEDULE_TIMEZONE:-}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_DIR=/data/backups
      - BACKUP_ENCRYPTION_ENABLED=${BACKUP_ENCRYPTION_ENABLED:-false}
      - BACKUP_ENCRYPTION_KEY_FILE=${BACKUP_ENCRYPTION_KEY_FILE:-}
      - BACKUP_MAX_CONCURRENT=1
      - BACKUP_QUEUE_NAME=system-backup
    volumes:
      - backup_data:/data/backups
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    build: ./proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/certs:/etc/nginx/certs
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  ioc_export_data:
  backup_data:
  published_feed_data:

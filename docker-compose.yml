services:
  db:
    image: postgres:16-alpine
    container_name: demo-db
    environment:
      - POSTGRES_DB=demo
      - POSTGRES_USER=demo
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: demo-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev-insecure-redis}"]
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: demo-backend
    environment:
      - PORT=3000
      # Dev-only bootstrap login. Set in .env for local demos; leave unset in production.
      - DEMO_EMAIL=${DEMO_EMAIL:-}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars, e.g. openssl rand -hex 32)}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-insecure-redis}
      - QUEUE_NAME=integration-imports
      - INTEGRATION_JOB_TIMEOUT_MS=600000
      - INTEGRATION_JOB_STALE_AFTER_MS=900000
      - SIGNAL_QUEUE_NAME=signal-events
      - LLM_RISK_QUEUE_NAME=llm-risk-jobs
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://192.168.1.14:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:14b}
      - LLM_RISK_ADVISOR_ENABLED=${LLM_RISK_ADVISOR_ENABLED:-true}
      - LLM_RISK_ADVISOR_URL=${LLM_RISK_ADVISOR_URL:-http://192.168.1.14:11434/api/generate}
      - LLM_RISK_ADVISOR_MODEL=${LLM_RISK_ADVISOR_MODEL:-qwen2.5:14b}
      - LLM_RISK_ADVISOR_TIMEOUT_MS=${LLM_RISK_ADVISOR_TIMEOUT_MS:-15000}
      - LLM_RISK_ADVISOR_MANUAL_TIMEOUT_MS=${LLM_RISK_ADVISOR_MANUAL_TIMEOUT_MS:-30000}
      - LLM_RISK_TEMPERATURE=${LLM_RISK_TEMPERATURE:-0.2}
      - LLM_RISK_NUM_CTX=${LLM_RISK_NUM_CTX:-2048}
      - LLM_RISK_NUM_PREDICT=${LLM_RISK_NUM_PREDICT:-180}
      - LLM_RISK_ADVISOR_AI_WEIGHT=${LLM_RISK_ADVISOR_AI_WEIGHT:-3}
      - LLM_RISK_ADVISOR_CACHE_TTL_SECONDS=${LLM_RISK_ADVISOR_CACHE_TTL_SECONDS:-3600}
      - ENVIRONMENT_INSIGHT_LLM_TIMEOUT_MS=${ENVIRONMENT_INSIGHT_LLM_TIMEOUT_MS:-90000}
      - ENVIRONMENT_INSIGHT_MAX_PROMPT_CHARS=${ENVIRONMENT_INSIGHT_MAX_PROMPT_CHARS:-12000}
      - ENVIRONMENT_INSIGHT_MAX_OUTPUT_TOKENS=${ENVIRONMENT_INSIGHT_MAX_OUTPUT_TOKENS:-350}
      - ENVIRONMENT_INSIGHT_TOP_SAMPLE_LIMIT=${ENVIRONMENT_INSIGHT_TOP_SAMPLE_LIMIT:-5}
      - AI_INSIGHT_RELATED_IOC_LOOKBACK_HOURS=${AI_INSIGHT_RELATED_IOC_LOOKBACK_HOURS:-24}
      - AI_INSIGHT_RELATED_IOC_LOOKFORWARD_HOURS=${AI_INSIGHT_RELATED_IOC_LOOKFORWARD_HOURS:-24}
      - AI_INSIGHT_HOST_IGNORE_CIDRS=${AI_INSIGHT_HOST_IGNORE_CIDRS:-127.0.0.0/8,169.254.0.0/16,224.0.0.0/4,172.18.0.0/16}
      # IOC list timing: log searchStringParse, dbQuery, responseSent, etc. (ms). Set to 0 or remove to disable.
      - IOC_LIST_TIMING=1
      - API_INGEST_TOKEN=${API_INGEST_TOKEN:-}
      - LOG_STORAGE=clickhouse
      - CLICKHOUSE_URL=http://demo-clickhouse:8123
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    depends_on:
      - db
      - redis
      - clickhouse
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  integration-scheduler:
    build:
      context: .
      dockerfile: integration/Dockerfile
    container_name: demo-integration-scheduler
    command: ["npm", "run", "scheduler"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-insecure-redis}
      - QUEUE_NAME=integration-imports
      - SCHEDULER_CRON=0 * * * *
      - SOURCE_NAME=EmergingThreats:blockrules
      - SOURCE_INDEX_URL=http://rules.emergingthreats.net/blockrules/
      - USOM_SOURCE_NAME=USOM:TR-CERT
      - USOM_API_URL=https://www.usom.gov.tr/url-list.txt
      - URLHAUS_SOURCE_NAME=URLhaus:abuse.ch
      - URLHAUS_AUTH_KEY=${URLHAUS_AUTH_KEY:-}
      - MALWARE_BAZAAR_SOURCE_NAME=MalwareBazaar:abuse.ch
      - MALWAREBAZAAR_AUTH_KEY=${MALWAREBAZAAR_AUTH_KEY:-}
      - THREATFOX_SOURCE_NAME=ThreatFox:abuse.ch
      - THREATFOX_AUTH_KEY=${THREATFOX_AUTH_KEY:-}
      - THREATFOX_API_URL=${THREATFOX_API_URL:-https://threatfox-api.abuse.ch/api/v1/}
      - THREATFOX_RECENT_DAYS=${THREATFOX_RECENT_DAYS:-3}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  integration-worker:
    build:
      context: .
      dockerfile: integration/Dockerfile
    container_name: demo-integration-worker
    command: ["npm", "run", "worker"]
    stop_grace_period: 45s
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-insecure-redis}
      - QUEUE_NAME=integration-imports
      - WORKER_CONCURRENCY=1
      - WORKER_LOCK_DURATION_MS=900000
      - WORKER_STALLED_INTERVAL_MS=60000
      - WORKER_MAX_STALLED_COUNT=5
      - INTEGRATION_JOB_TIMEOUT_MS=600000
      - EMERGINGTHREATS_JOB_TIMEOUT_MS=2700000
      - PHISHTANK_JOB_TIMEOUT_MS=3600000
      - PHISHTANK_BATCH_SIZE=2000
      - PHISHTANK_SOURCE_NAME=PhishTank:open_dnsrr
      - PHISHTANK_CSV_URL=${PHISHTANK_CSV_URL:-https://data.phishtank.com/data/online-valid.csv}
      - INTEGRATION_JOB_HEARTBEAT_INTERVAL_MS=30000
      - INTEGRATION_JOB_STALE_AFTER_MS=900000
      - INTEGRATION_WORKER_SHUTDOWN_GRACE_MS=30000
      - INTEGRATION_QUEUE_CLEANUP_INTERVAL_MS=60000
      - SOURCE_NAME=EmergingThreats:blockrules
      - SOURCE_INDEX_URL=http://rules.emergingthreats.net/blockrules/
      - USOM_SOURCE_NAME=USOM:TR-CERT
      - USOM_API_URL=https://www.usom.gov.tr/url-list.txt
      - URLHAUS_SOURCE_NAME=URLhaus:abuse.ch
      - URLHAUS_AUTH_KEY=${URLHAUS_AUTH_KEY:-}
      - MALWARE_BAZAAR_SOURCE_NAME=MalwareBazaar:abuse.ch
      - MALWAREBAZAAR_AUTH_KEY=${MALWAREBAZAAR_AUTH_KEY:-}
      - THREATFOX_SOURCE_NAME=ThreatFox:abuse.ch
      - THREATFOX_AUTH_KEY=${THREATFOX_AUTH_KEY:-}
      - THREATFOX_API_URL=${THREATFOX_API_URL:-https://threatfox-api.abuse.ch/api/v1/}
      - THREATFOX_RECENT_DAYS=${THREATFOX_RECENT_DAYS:-3}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  signal-engine:
    build: ./backend
    container_name: demo-signal-engine
    command: ["npm", "run", "signal-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-insecure-redis}
      - SIGNAL_QUEUE_NAME=signal-events
      - SIGNAL_WORKER_CONCURRENCY=2
    depends_on:
      - db
      - redis
    restart: unless-stopped

  ioc-correlation-engine:
    build: ./backend
    container_name: demo-ioc-correlation-engine
    command: ["npm", "run", "ioc-correlation-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - LOG_STORAGE=clickhouse
      - CLICKHOUSE_URL=http://demo-clickhouse:8123
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - IOC_CORRELATION_WORKER_NAME=clickhouse-ioc-correlation-v1
      - IOC_CORRELATION_POLL_INTERVAL_MS=30000
      - IOC_CORRELATION_BATCH_SIZE=2000
      - IOC_CORRELATION_MAX_BATCHES_PER_TICK=1
      - IOC_CORRELATION_DEDUP_WINDOW_SECONDS=300
      - IOC_LOOKUP_SYNC_INTERVAL_SECONDS=300
      - IOC_LOOKUP_SYNC_BATCH_SIZE=20000
      - IOC_LOOKUP_SYNC_ENABLED=1
      - IOC_CORRELATION_CH_MAX_THREADS=1
      - IOC_CORRELATION_CH_MAX_EXECUTION_TIME_SECONDS=20
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-insecure-redis}
      - LLM_RISK_QUEUE_NAME=llm-risk-jobs
      - LLM_RISK_TRIGGER_ENABLED=1
      - LLM_RISK_SNAPSHOT_TTL_SECONDS=604800
    depends_on:
      - db
      - clickhouse
    restart: unless-stopped

  ioc-retro-engine:
    build: ./backend
    container_name: demo-ioc-retro-engine
    command: ["npm", "run", "ioc-retro-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - LOG_STORAGE=clickhouse
      - CLICKHOUSE_URL=http://demo-clickhouse:8123
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - IOC_LOOKUP_SYNC_INTERVAL_SECONDS=3600
      - IOC_LOOKUP_SYNC_ENABLED=0
      - IOC_RETRO_SCAN_INTERVAL_SECONDS=3600
      - IOC_RETRO_LOOKBACK_DAYS=30
      - IOC_RETRO_NEW_IOC_WINDOW_HOURS=24
      - IOC_RETRO_MAX_NEW_IOCS=20000
      - IOC_RETRO_BATCH_SIZE=5000
      - IOC_RETRO_IOC_CHUNK_SIZE=1000
      - IOC_RETRO_POLL_INTERVAL_MS=5000
      - IOC_RETRO_ALIGN_ENABLED=1
      - IOC_RETRO_ALIGN_MINUTE=10
      - IOC_CORRELATION_DEDUP_WINDOW_SECONDS=300
      - IOC_RETRO_CH_MAX_THREADS=1
      - IOC_RETRO_CH_MAX_EXECUTION_TIME_SECONDS=25
    depends_on:
      - db
      - clickhouse
    restart: unless-stopped

  ioc-expiration-worker:
    build: ./backend
    container_name: demo-ioc-expiration-worker
    command: ["npm", "run", "ioc-expiration-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - LOG_STORAGE=clickhouse
      - CLICKHOUSE_URL=http://demo-clickhouse:8123
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - IOC_EXPIRATION_POLL_INTERVAL_MS=60000
      - IOC_EXPIRATION_BATCH_SIZE=500
    depends_on:
      - db
      - clickhouse
    restart: unless-stopped

  ioc-match-count-worker:
    build: ./backend
    container_name: demo-ioc-match-count-worker
    command: ["npm", "run", "ioc-match-count-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - LOG_STORAGE=clickhouse
      - CLICKHOUSE_URL=http://demo-clickhouse:8123
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - IOC_MATCH_COUNT_INTERVAL_MS=60000
      - IOC_MATCH_COUNT_BATCH_SIZE=2000
      - IOC_MATCH_COUNT_CH_MAX_THREADS=1
      - IOC_MATCH_COUNT_CH_MAX_EXECUTION_TIME_SECONDS=120
    depends_on:
      - db
      - clickhouse
    restart: unless-stopped

  llm-risk-worker:
    build: ./backend
    container_name: demo-llm-risk-worker
    command: ["npm", "run", "llm-risk-worker"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev-insecure-redis}
      - LLM_RISK_QUEUE_NAME=llm-risk-jobs
      - LLM_RISK_WORKER_CONCURRENCY=1
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://192.168.1.14:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:14b}
      - LLM_RISK_ADVISOR_ENABLED=${LLM_RISK_ADVISOR_ENABLED:-true}
      - LLM_RISK_ADVISOR_URL=${LLM_RISK_ADVISOR_URL:-http://192.168.1.14:11434/api/generate}
      - LLM_RISK_ADVISOR_MODEL=${LLM_RISK_ADVISOR_MODEL:-qwen2.5:14b}
      - LLM_RISK_ADVISOR_TIMEOUT_MS=${LLM_RISK_ADVISOR_TIMEOUT_MS:-15000}
      - LLM_RISK_ADVISOR_MANUAL_TIMEOUT_MS=${LLM_RISK_ADVISOR_MANUAL_TIMEOUT_MS:-30000}
      - LLM_RISK_TEMPERATURE=${LLM_RISK_TEMPERATURE:-0.2}
      - LLM_RISK_NUM_CTX=${LLM_RISK_NUM_CTX:-2048}
      - LLM_RISK_NUM_PREDICT=${LLM_RISK_NUM_PREDICT:-180}
      - LLM_RISK_ADVISOR_AI_WEIGHT=${LLM_RISK_ADVISOR_AI_WEIGHT:-3}
      - LLM_RISK_ADVISOR_CACHE_TTL_SECONDS=${LLM_RISK_ADVISOR_CACHE_TTL_SECONDS:-3600}
      - ENVIRONMENT_INSIGHT_LLM_TIMEOUT_MS=${ENVIRONMENT_INSIGHT_LLM_TIMEOUT_MS:-90000}
      - ENVIRONMENT_INSIGHT_MAX_PROMPT_CHARS=${ENVIRONMENT_INSIGHT_MAX_PROMPT_CHARS:-12000}
      - ENVIRONMENT_INSIGHT_MAX_OUTPUT_TOKENS=${ENVIRONMENT_INSIGHT_MAX_OUTPUT_TOKENS:-350}
      - ENVIRONMENT_INSIGHT_TOP_SAMPLE_LIMIT=${ENVIRONMENT_INSIGHT_TOP_SAMPLE_LIMIT:-5}
      - AI_INSIGHT_RELATED_IOC_LOOKBACK_HOURS=${AI_INSIGHT_RELATED_IOC_LOOKBACK_HOURS:-24}
      - AI_INSIGHT_RELATED_IOC_LOOKFORWARD_HOURS=${AI_INSIGHT_RELATED_IOC_LOOKFORWARD_HOURS:-24}
      - AI_INSIGHT_HOST_IGNORE_CIDRS=${AI_INSIGHT_HOST_IGNORE_CIDRS:-127.0.0.0/8,169.254.0.0/16,224.0.0.0/4,172.18.0.0/16}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  syslog-receiver:
    build: ./backend
    container_name: demo-syslog-receiver
    command: ["npm", "run", "syslog-receiver"]
    ports:
      - "514:514/udp"
      - "8081:8081"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=demo
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=demo
      - SYSLOG_PORT=514
      - SYSLOG_HOST=0.0.0.0
      - SYSLOG_HEALTH_PORT=8081
      - SYSLOG_HEALTH_TOKEN=${SYSLOG_HEALTH_TOKEN:?Set SYSLOG_HEALTH_TOKEN in .env (e.g. openssl rand -hex 16)}
      # Avoid ClickHouse small-part amplification: micro-batch flush (rows OR time)
      - SYSLOG_BATCH_SIZE=3000
      - SYSLOG_MIN_FLUSH_SIZE=1000
      - SYSLOG_MIN_INSERT_ROWS=1000
      - SYSLOG_FORCE_FLUSH_MAX_MS=60000
      - SYSLOG_FLUSH_INTERVAL_MS=3000
      - SYSLOG_FLUSH_WORKERS=1
      - SYSLOG_MAX_BUFFERED=100000
      - SYSLOG_OVERFLOW_POLICY=drop_oldest
      - SYSLOG_SOCKET_RCVBUF=8388608
      - LOG_STORAGE=clickhouse
      - CLICKHOUSE_URL=http://demo-clickhouse:8123
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    depends_on:
      - db
      - clickhouse
    # UDP 514 / HTTP health are not published on the host by default (avoids open ingest + unauthenticated metrics).
    # To expose for local forwarders or host scripts: docker compose -f docker-compose.yml -f docker-compose.syslog-host.yml up -d
    restart: unless-stopped

  # ClickHouse is reachable only on the Docker network (demo-clickhouse:8123 / :9000).
  # Do not publish HTTP/native ports to the host in production. For ad-hoc queries:
  #   docker compose exec clickhouse clickhouse-client -u demo --password "$CLICKHOUSE_PASSWORD"
  clickhouse:
    build:
      context: .
      dockerfile: Dockerfile.clickhouse
    container_name: demo-clickhouse
    environment:
      - CLICKHOUSE_USER=demo
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    restart: unless-stopped

  loadgen:
    build: ./tools/loadgen
    container_name: demo-loadgen
    profiles: ["manual"]
    environment:
      - PYTHONUNBUFFERED=1
      - ENABLED=0
      - MODE=mixed
      - EPS=100
      - DURATION_SECONDS=86400
      - IOC_INSERT_RATIO=0
      - REALTIME_RATIO=0.5
      - RETRO_DELAY_MS=0
      - STATS_EVERY_SEC=10
      - SYSLOG_HOST=syslog-receiver
      - SYSLOG_PORT=514
      - IOC_API_BASE=http://backend:3000
      - API_INGEST_TOKEN=${API_INGEST_TOKEN:-}
      - API_BEARER_TOKEN=${API_BEARER_TOKEN:-}
      - IOC_SOURCE_NAME=loadgen-smoke
      - IOC_CONFIDENCE=90
      - IOC_NOTE=loadgen random ioc
    depends_on:
      - backend
      - syslog-receiver
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: demo-frontend
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    build: ./proxy
    container_name: demo-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/certs:/etc/nginx/certs
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

# Redact the Published Feed pull key so it never lands in access logs in plaintext.
map $request_uri $log_uri {
  ~^(?<pre>.*[?&]api_key=)[^&]*(?<post>.*)$  "${pre}REDACTED${post}";
  default $request_uri;
}
log_format redacted_apikey '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $log_uri $server_protocol" '
                           '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  listen 80;
  server_name _;

  access_log /var/log/nginx/access.log redacted_apikey;

  # Docker embedded DNS for dynamic service-name resolution
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    set $backend_upstream http://backend:3000;
    proxy_pass $backend_upstream;
    # Backup archives can be hundreds of MB; allow long streaming downloads.
    proxy_connect_timeout 90s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /public/ {
    set $backend_upstream http://backend:3000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri /index.html;
  }

  location / {
    try_files $uri /index.html;
  }
}

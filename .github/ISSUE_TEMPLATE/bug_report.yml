name: Bug report
description: Report a defect in TalonHound
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. **Do not report security vulnerabilities here** — see [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TalonHound version
      description: From Administration → Settings or the repository VERSION file
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - installation.sh
        - Docker Compose (source build)
        - Other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Host platform
      description: OS and architecture (for example Ubuntu 24.04 / linux/arm64)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets, tokens, and passwords before pasting.

# Edge TLS termination → internal frontend (HTTP). Trust X-Forwarded-Proto downstream.
# TLS profile aligned with Mozilla “modern” guidance (TLS 1.2+ / AEAD ciphers).

# Redact the Published Feed pull key so it never lands in access logs in plaintext.
map $request_uri $log_uri {
  ~^(?<pre>.*[?&]api_key=)[^&]*(?<post>.*)$  "${pre}REDACTED${post}";
  default $request_uri;
}
log_format redacted_apikey '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $log_uri $server_protocol" '
                           '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  access_log /var/log/nginx/access.log redacted_apikey;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name _;

  access_log /var/log/nginx/access.log redacted_apikey;

  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;

  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # OCSP stapling (public CA + OCSP URI: nginx sends staple). verify=off avoids self-signed / missing chain breakage.
  ssl_stapling on;
  ssl_stapling_verify off;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # HSTS: tighten max-age / preload in production if you own a stable hostname
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Variable-based proxy_pass forces nginx to re-resolve the `backend` service name at
  # request time via the Docker embedded DNS `resolver` (above), instead of caching the IP
  # at config load for the worker's lifetime. Without this, recreating the backend container
  # (new Docker IP) causes a persistent 502 until the proxy is reloaded.
  location = /healthz {
    set $backend_upstream http://backend:3000;
    proxy_pass $backend_upstream/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /readyz {
    set $backend_upstream http://backend:3000;
    proxy_pass $backend_upstream/readyz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    set $upstream http://frontend:80;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    # Large backup downloads stream through frontend → backend; keep generous timeouts.
    proxy_connect_timeout 90s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

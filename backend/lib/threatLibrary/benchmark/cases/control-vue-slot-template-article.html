    <h1>New data reveals espionage focus of a slot-rendered actor</h1>
    <h2>Overview</h2>
    <p>In the course of monitoring, we discovered a new remote access trojan and observed for the first time the threat actor using an open-source post-exploitation framework against government and industrial organizations.</p>
    <p>The initial access vector remained phishing: archives with malicious MSI installers delivered from a compromised mailbox, with lure documents tailored to each recipient organization.</p>
    <h2>Key findings</h2>
    <ul>
      <li>The actor moved from financially motivated intrusions to espionage against government targets.</li>
      <li>The new trojan supports a fallback command server that the operators can set from the command line.</li>
      <li>The implant learns its public address from api.ipify.org before registering with the server.</li>
    </ul>
    <h2>Trojan analysis</h2>
    <p>The trojan copies itself to the user profile, creates a scheduled task named WindowsUpdate and connects to its command server over WebSocket. Every infected host receives an identifier that appears in the WebSocket path.</p>
    <p>If the configuration contains a placeholder, the trojan falls back to a hardcoded address that we did not observe in use during the investigation.</p>
    <h2>Indicators of compromise</h2>
    <h3>Checksums</h3>
    <p>3f1c0f4f6c1e2a9b8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c</p>
